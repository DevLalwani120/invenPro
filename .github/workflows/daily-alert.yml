name: Daily Inventory Alert

on:
  schedule:
    - cron: '0 3 * * *'   # 9:00 AM IST (UTC+5:30 = 3:30 AM UTC)
  workflow_dispatch:         # manual trigger from GitHub Actions tab anytime

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install alert dependencies
        run: |
          cd alert-script
          npm install

      - name: Run daily alert
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER:               ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:       ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAILS:             ${{ secrets.ALERT_EMAILS }}
        run: node alert-script/index.js
